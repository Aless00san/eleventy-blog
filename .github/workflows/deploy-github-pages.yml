# Build Eleventy and deploy `dist/` to GitHub Pages.
#
# Setup (one time, in GitHub UI):
#   Repo Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
#
# Project Pages URL will be: https://aless00san.github.io/eleventy-blog/
# If you later use a custom domain or a user site (username.github.io),
# set PATHPREFIX to '/' and URL to your root URL below.

name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      URL: https://aless00san.github.io/eleventy-blog
      PATHPREFIX: /eleventy-blog/
      ELEVENTY_ENV: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Disable Jekyll
        run: touch dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
